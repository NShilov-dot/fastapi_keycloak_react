# CI for the template. On GitLab/other CI, mirror this with a single `make ci`
# step (backend gates + frontend typecheck) plus the frontend build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.4"
          python-version: "3.12"
          enable-cache: true
      - name: Install deps (frozen — fails if uv.lock is out of date)
        run: uv sync --frozen
      - name: Audit runtime deps (pip-audit on the locked prod closure)
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project -o "$RUNNER_TEMP/req.txt"
          uvx --from pip-audit==2.10.1 pip-audit -r "$RUNNER_TEMP/req.txt" --no-deps --disable-pip
      - name: Lint (ruff)
        run: uv run ruff check src tests
      - name: Type-check (mypy --strict, src)
        run: uv run mypy src
      - name: Tests (pytest; testcontainers uses the runner's Docker)
        run: uv run pytest -q
        env:
          PYTHONPATH: src

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Audit runtime deps (what ships in the bundle)
        run: npm audit --omit=dev
      - name: Type-check + build
        run: npm run build
